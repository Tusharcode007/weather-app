<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
     <script src="script.js" defer></script>
    
    <title>weather </title>
</head>
<body>
    
    <div class="card">

        <div class="search">
            <input type ='text' placeholder="enter city name">
            <button> <img src="images/search.png"</button>
        </div>

        <div class="weather">
            <img src="images/rain.png" class="weather-icon" alt="">
            <div>
            <h1 class="temp"> 20 c </h1>
            <h2 class="city"> khagaria</h2>
            </div>


                <div class="details1">

                    <div class="col1">
                        <img src="images/wind.png" alt="">
                        <div>
                            <p class="wind">10 km/h</p>
                            <p> Wind speed</p>
                        </div>
                    </div>

                    <div class="row1">
                        <img src="images/humidity.png" alt="">
                        <div>
                            <p class="humidity">28%</p>
                            <p> humidity</p>
                        </div>
                    </div>
                </div>

                <div class="details2">

                    <div class="col2">
                        <!-- <img src="images/wind.png" alt=""> -->
                        <div>
                            <p class="pressure">1000 km/h</p>
                            <p> pressure</p>
                        </div>
                    </div>

                    <div class="row2">
                        <!-- <img src="images/humidity.png" alt=""> -->
                        <div>
                            <p class="lat">25</p>
                            <p> latitude</p>
                        </div>
                    </div>


                </div>
        </div>



    </div>

</body>
</html>
